name: Deploy to Contabo VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Pull & Rebuild Container on Contabo
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to Contabo VPS
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -e
            echo "=== 1. Acessando diretório do projeto na VPS ==="
            cd /app/middleware-ia-docuware

            echo "=== 2. Baixando última versão da branch main do GitHub ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== 3. Construindo nova imagem e recriando container de forma limpa ==="
            docker network create reverse-proxy-network 2>/dev/null || true
            docker compose build
            docker compose down --remove-orphans 2>/dev/null || true
            docker rm -f docuware-ai-gateway 2>/dev/null || true
            docker compose up -d

            echo "=== 4. Configurando rota /ai-gateway/ no portal_nginx ==="
            sed -i 's/\r$//' scripts/configure-nginx.sh
            bash scripts/configure-nginx.sh

            echo "=== 5. Limpando imagens antigas sem uso ==="
            docker image prune -f

            echo "=== 6. Validando Healthcheck Direto e via Nginx ==="
            PORT_VAL=$(grep -E '^PORT=' .env | cut -d '=' -f2 | tr -d '\r' || echo "3014")
            PORT_NUM="${PORT_VAL:-3014}"
            echo -n "Aguardando inicialização na porta ${PORT_NUM}..."
            HEALTHY=false
            for i in $(seq 1 15); do
              if curl -s -f "http://127.0.0.1:${PORT_NUM}/health" > /dev/null 2>&1; then
                HEALTHY=true
                break
              fi
              sleep 2
              echo -n "."
            done
            echo ""
            if [ "$HEALTHY" = "true" ]; then
              echo -n "Direto (porta ${PORT_NUM}): "
              curl --fail -s "http://127.0.0.1:${PORT_NUM}/health"
              echo ""
            else
              echo "Falha no healthcheck direto após 30 segundos. Verificando logs do container:"
              docker logs --tail 40 docuware-ai-gateway
              exit 1
            fi
            echo -n "Via Nginx (wp.processcloud.app/ai-gateway/health): "
            curl -s -H "Host: wp.processcloud.app" "http://127.0.0.1/ai-gateway/health" || true
            echo ""
            echo "=== Deploy concluído com sucesso! ==="
