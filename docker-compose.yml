services:
  docuware-ai-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docuware-ai-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3014}
      - HOST=0.0.0.0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - CUSTOM_AI_API_KEY=${CUSTOM_AI_API_KEY:-}
      - CUSTOM_AI_BASE_URL=${CUSTOM_AI_BASE_URL:-}
      - CUSTOM_AI_MODEL=${CUSTOM_AI_MODEL:-gpt-4o}
      - OPENAI_TIMEOUT_MS=${OPENAI_TIMEOUT_MS:-45000}
      - OPENAI_MAX_RETRIES=${OPENAI_MAX_RETRIES:-2}
      - API_AUTH_TOKEN=${API_AUTH_TOKEN}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-31457280}
      - DOCUWARE_PLATFORM_URL=${DOCUWARE_PLATFORM_URL:-https://rcsangola.docuware.cloud/DocuWare/Platform}
      - DOCUWARE_USERNAME=${DOCUWARE_USERNAME:-}
      - DOCUWARE_PASSWORD=${DOCUWARE_PASSWORD:-}
      - DOCUWARE_BEARER_TOKEN=${DOCUWARE_BEARER_TOKEN:-}
      - DOCUWARE_HOST_ID=${DOCUWARE_HOST_ID:-}
      - DOCUWARE_TIMEOUT_MS=${DOCUWARE_TIMEOUT_MS:-30000}
      - DOCUWARE_MAX_CONCURRENCY=${DOCUWARE_MAX_CONCURRENCY:-5}
      - DOCUWARE_MAX_TEXTSHOT_CHARS=${DOCUWARE_MAX_TEXTSHOT_CHARS:-2000000}
      - CLASSIFIER_DATA_DIR=${CLASSIFIER_DATA_DIR:-/app/data}
      - CLASSIFIER_MIN_EXAMPLES_PER_CATEGORY=${CLASSIFIER_MIN_EXAMPLES_PER_CATEGORY:-10}
      - CLASSIFIER_MIN_CATEGORIES_FOR_MODEL=${CLASSIFIER_MIN_CATEGORIES_FOR_MODEL:-2}
      - CLASSIFIER_MIN_TEXT_CHARS=${CLASSIFIER_MIN_TEXT_CHARS:-30}
      - CLASSIFIER_MAX_FEATURE_CHARS=${CLASSIFIER_MAX_FEATURE_CHARS:-15000}
      - CLASSIFIER_MAX_FEATURE_PAGES=${CLASSIFIER_MAX_FEATURE_PAGES:-5}
      - CLASSIFIER_MIN_CONFIDENCE=${CLASSIFIER_MIN_CONFIDENCE:-0.70}
      - CLASSIFIER_MIN_MARGIN=${CLASSIFIER_MIN_MARGIN:-0.15}
      - CLASSIFIER_MIN_VALIDATION_F1=${CLASSIFIER_MIN_VALIDATION_F1:-0.75}
    expose:
      - "${PORT:-3014}"
    ports:
      - "127.0.0.1:${PORT:-3014}:${PORT:-3014}"
    volumes:
      - docuware_classifier_data:/app/data
    mem_limit: 1g
    cpus: 1.5
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
    networks:
      - default

volumes:
  docuware_classifier_data:

networks:
  default:
    external: true
    name: reverse-proxy-network
